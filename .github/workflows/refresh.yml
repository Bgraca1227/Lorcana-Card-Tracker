name: Refresh prices

on:
  schedule:
    - cron: "23 10 * * *"   # daily, 10:23 UTC (6:23 am Eastern)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fetch prices and merge history
        env:
          JUSTTCG_KEY: ${{ secrets.JUSTTCG_KEY }}
        run: python3 scripts/refresh.py
      - name: Commit
        run: |
          git config user.name "lore-ledger-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json img
          git diff --cached --quiet || git commit -m "Refresh prices $(date -u +%F)"
          git push
